<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Investment Analysis Report</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="container">
    <h1>💼 Investment Analysis Agent</h1>

    <!-- Input Section -->
    <div id="input-container">
      <input type="text" id="user-input" placeholder="Ask about NVDA, AAPL, financial data, etc..." />
      <select id="model-select">
        <option value="auto">🤖 Auto (Agent decides)</option>
        <option value="openai">🔓 OpenAI</option>
        <option value="gemini">🧠 Gemini</option>
      </select>
      <button id="submit-button" onclick="submitQuery()">Submit</button>
      <div id="error-message" class="error"></div>
    </div>

    <!-- Response Area -->
    <div id="response" style="margin-top: 2rem; padding: 1rem; border-radius: 8px; background-color: #f5f5f5;">
      <!-- JS populates this -->
    </div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
